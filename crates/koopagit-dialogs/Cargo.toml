[package]
name = "koopagit-dialogs"
description = "Slint dialogs (TortoiseProc's dialogs) for KoopaGit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
koopagit-core.workspace = true
koopagit-shell.workspace = true
koopagit-ui.workspace = true
slint = "1.18"
arboard = { version = "3.6", default-features = false }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
trash = "5.2"

# platform::init sets the activation policy through winit's event loop builder.
[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1.18", features = ["unstable-winit-030"] }

# Not used directly: caps the zbus Slint uses. Slint 1.18.1 treats a missing D-Bus
# session bus (WSLg, bare compositors) as normal only for zbus < 5.19's error variants;
# 5.19's new `Error::Connection` makes every launch print "Error watching for xdg
# desktop settings: Failed to connect to address ...". Drop once Slint matches it.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = ">=5, <5.19", default-features = false }

[dev-dependencies]
i-slint-backend-testing = "1.18"
i-slint-common = "1.18"
tempfile.workspace = true
